<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found · Hush</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#D7E5F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111C28" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="32x32" href="/app/icon-32.png">
<link rel="apple-touch-icon" href="/app/icon-180.png">
<style>
:root{
  color-scheme:light dark;
  --bg:#D7E5F1; --surface:#EEF4F9; --text:#12202D; --muted:#46596A; --line:#B7CBDC;
  --accent:#17448A; --accent-ink:#EEF4F9; --shadow:0 1px 2px rgba(18,32,45,.07);
  --logo-shadow:0 8px 24px rgba(18,32,45,.18);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#111C28; --surface:#182635; --text:#DDE8F2; --muted:#98ADC1; --line:#2A3C4F;
    --accent:#6CB4F0; --accent-ink:#0B1A2A; --shadow:0 1px 0 rgba(4,9,15,.4);
    --logo-shadow:0 8px 24px rgba(0,0,0,.5);
  }
}
*,*::before,*::after{box-sizing:border-box}
html{min-height:100%}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 24px) max(24px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(24px,env(safe-area-inset-left,0px));
  background:var(--bg);color:var(--text);
  font:15px/1.4 Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
main{width:100%;max-width:360px;text-align:center}
img{display:block;margin:0 auto 24px;width:104px;height:104px;border-radius:23%;box-shadow:var(--logo-shadow)}
h1{margin:0 0 8px;font-size:26px;font-weight:600;line-height:1.2;text-wrap:balance}
p{margin:0 0 32px;color:var(--muted);text-wrap:pretty}
a{display:block;width:100%;min-height:48px;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:13px 16px;
  line-height:22px;font-weight:600;text-decoration:none;box-shadow:var(--shadow)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<main>
  <img src="/app/icon-180.png" width="104" height="104" alt="Hush">
  <h1>Page not found</h1>
  <p>The page you’re looking for doesn’t exist or has moved.</p>
  <a href="/">Back to Hush</a>
</main>
</body>
</html>
