<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self'; connect-src 'self' data: blob: wss://hushappofficial.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Hush</title>
<meta name="description" content="Hush: private messaging with end-to-end encryption.">
<meta name="theme-color" content="#F2F2F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" sizes="32x32" href="app/icon-32.png">
<link rel="apple-touch-icon" href="app/icon-180.png">
<link rel="stylesheet" href="app/styles.css?v=2fa0016ddbad" integrity="sha256-L6ABbdutdeYIRYD9JD+HMoUTvV/UkDoSck39TzT136k=">
</head>
<body>
<div id="app">
  <section class="pane pane-list">
    <div class="bar top">
      <h1 class="list-title" id="listTitle">Chats</h1>
      <span class="net" id="netStatus" aria-live="polite"></span>
    </div>
    <div class="searchrow"><label class="search"><span id="searchIc"></span><input id="q" placeholder="Search chats" autocomplete="off" enterkeyhint="search"></label></div>
    <div id="banner"></div>
    <div id="threads"></div>
    <div id="calls" hidden></div>
    <div id="profileView" hidden></div>
    <button class="fab" id="newBtn" aria-label="New message"></button>
    <nav class="tabs" role="tablist">
      <button class="tab" data-tab="chats" role="tab" aria-selected="true"><span class="tab-ic" id="tabChatsIc"></span><span>Chats</span><span class="tab-n" id="tabN" hidden></span></button>
      <button class="tab" data-tab="calls" role="tab" aria-selected="false"><span class="tab-ic" id="tabCallsIc"></span><span>Calls</span><span class="tab-n red" id="tabCallsN" hidden></span></button>
      <button class="tab" data-tab="profile" role="tab" aria-selected="false"><span class="tab-ic" id="tabProfileIc"></span><span>Settings</span></button>
    </nav>
  </section>
  <section class="pane pane-chat" id="chatPane">
    <div class="chat-blank"><span class="chip">Select a chat to start messaging</span></div>
  </section>
</div>

<script src="vendor/qrcode.min.js?v=164fc2c1c9ea" integrity="sha256-Fk/Cwcnq8KA6qN/bhV6C5BpcaSL7rYuzI4EWIH4mvvc="></script>
<script src="app/config.js?v=a099cab4098e" integrity="sha256-oJnKtAmOK7oDkUkmauvad8AiFwVTVRMNpTh/jkZxaBo="></script>
<script src="app/crypto.js?v=5ddcc74c8af9" integrity="sha256-XdzHTIr5aq9c8aFEw4BPXAvCj3kAXLqoVKEcK4NnhD4="></script>
<script src="app/adapter.js?v=5f3707a98e5b" integrity="sha256-XzcHqY5bKY7wTiPyzzQGjaphPGrdBdiAacsWyi5cF7k="></script>
<script src="app/ui.js?v=5e1294020b8b" integrity="sha256-XhKUAguLxf9kG5hI8pLZppSsE66Lza4tH5E4D6XawMk="></script>
</body>
</html>
